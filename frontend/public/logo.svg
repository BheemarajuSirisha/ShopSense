<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pubLogoStoreBaseGrad" x1="16" y1="26" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A1259" stop-opacity="0.2" />
      <stop offset="1" stop-color="#B5179E" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Storefront Icon (scaled & centered around x: 10-50, y: 8-52) -->
  <g transform="translate(10, 8) scale(1.35)">
    <!-- Upward Chart Spark above storefront -->
    <path
      d="M6 6.5 L12 4 L17.5 5.5 L24 2"
      stroke="#F8B4D9"
      stroke-width="1.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="12" cy="4" r="1.1" fill="#FFFFFF" />
    <circle cx="17.5" cy="5.5" r="1.1" fill="#FFFFFF" />
    <path
      d="M24 0.2 Q24 2 25.8 2 Q24 2 24 3.8 Q24 2 22.2 2 Q24 2 24 0.2 Z"
      fill="#FFFFFF"
    />

    <!-- Storefront Building Base -->
    <rect
      x="6"
      y="15.5"
      width="20"
      height="12.5"
      rx="1"
      fill="url(#pubLogoStoreBaseGrad)"
      stroke="#B5179E"
      stroke-width="1.2"
    />

    <!-- Showcase Window -->
    <rect
      x="8"
      y="18.2"
      width="8"
      height="6.8"
      rx="0.75"
      fill="#FFFFFF"
      fill-opacity="0.4"
      stroke="#F8B4D9"
      stroke-width="0.9"
    />
    <line x1="12" y1="18.2" x2="12" y2="25" stroke="#F8B4D9" stroke-width="0.8" />
    <line x1="8" y1="21.6" x2="16" y2="21.6" stroke="#F8B4D9" stroke-width="0.8" />

    <!-- Storefront Door -->
    <rect
      x="18"
      y="18.2"
      width="6"
      height="9.8"
      rx="0.75"
      fill="#7A1259"
      stroke="#F8B4D9"
      stroke-width="0.9"
    />
    <circle cx="22.5" cy="23.2" r="0.65" fill="#FFFFFF" />

    <!-- Ground Foundation Line -->
    <line x1="4" y1="29" x2="28" y2="29" stroke="#B5179E" stroke-width="1.4" stroke-linecap="round" />

    <!-- Striped Awning -->
    <rect x="4.5" y="8" width="23" height="1.8" rx="0.9" fill="#7A1259" stroke="#B5179E" stroke-width="0.6" />

    <!-- 5 Striped Segments with Scalloped Base -->
    <path d="M5.5 9.8 L4.5 14.5 C4.5 15.8 8.8 15.8 8.8 14.5 L9.5 9.8 Z" fill="#B5179E" stroke="#7A1259" stroke-width="0.5" />
    <path d="M9.5 9.8 L8.8 14.5 C8.8 15.8 13.3 15.8 13.3 14.5 L13.8 9.8 Z" fill="#F8B4D9" stroke="#B5179E" stroke-width="0.5" />
    <path d="M13.8 9.8 L13.3 14.5 C13.3 15.8 18.2 15.8 18.2 14.5 L18.2 9.8 Z" fill="#B5179E" stroke="#7A1259" stroke-width="0.5" />
    <path d="M18.2 9.8 L18.2 14.5 C18.2 15.8 22.7 15.8 22.7 14.5 L22.5 9.8 Z" fill="#F8B4D9" stroke="#B5179E" stroke-width="0.5" />
    <path d="M22.5 9.8 L22.7 14.5 C22.7 15.8 27.5 15.8 27.5 14.5 L26.5 9.8 Z" fill="#B5179E" stroke="#7A1259" stroke-width="0.5" />
  </g>

  <!-- Text ShopSense -->
  <text x="62" y="38" font-family="'Poppins', sans-serif" font-weight="700" font-size="28" fill="#3B0A33">Shop<tspan fill="#B5179E" font-weight="700">Sense</tspan></text>
</svg>
